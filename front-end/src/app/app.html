<!-- VideoTube App Shell -->
<app-header (menuToggle)="toggleSidebar()" />

<!-- Mobile overlay backdrop -->
@if (sidebarOpen()) {
  <div
    class="sidebar-backdrop"
    aria-hidden="true"
    (click)="closeSidebar()"
  ></div>
}

<app-sidebar [isOpen]="sidebarOpen()" />

<main class="content-area" [class.sidebar-open]="sidebarOpen()">
  <router-outlet />
</main>
