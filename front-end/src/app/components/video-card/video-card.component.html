<article class="video-card">
  <!-- Thumbnail -->
  <a class="thumbnail-wrap" href="#" (click)="$event.preventDefault()">
    <img
      class="thumbnail"
      [src]="video().thumbnailUrl"
      [alt]="video().title"
      loading="lazy"
      (error)="onThumbnailError($event)"
    />
    <span class="duration-badge">{{ formattedDuration() }}</span>
  </a>

  <!-- Meta row -->
  <div class="meta-row">
    <!-- Channel avatar -->
    <div class="avatar-wrap">
      <img
        class="channel-avatar"
        [src]="video().channelProfileUrl"
        [alt]="video().channelName"
        loading="lazy"
        (error)="onAvatarError($event)"
      />
    </div>

    <!-- Text info -->
    <div class="video-info">
      <h3 class="video-title" [title]="video().title">{{ video().title }}</h3>

      <div class="channel-row">
        <span class="channel-name">{{ video().channelName }}</span>
        @if (video().isVerified) {
          <svg class="verified-badge" viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5l-4-4 1.41-1.41L10 13.67l6.59-6.59L18 8.5l-8 8z"/>
          </svg>
        }
      </div>

      <div class="video-stats">
        <span>{{ formattedViews() }}</span>
        <span class="dot">•</span>
        <span>{{ relativeTime() }}</span>
      </div>
    </div>
  </div>
</article>
